<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meeting Tracker</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a5f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

    <!-- ===== TOP HEADER ===== -->
    <header class="app-header">
        <span class="header-title">Meeting Tracker</span>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="tab-content">

        <!-- TAB 1: HOME -->
        <section id="homeTab" class="tab-page active">
            <div class="week-nav">
                <button class="nav-arrow" id="homePrev">&#9664;</button>
                <button class="week-display" id="homeWeekBtn">September 17, 2026</button>
                <button class="nav-arrow" id="homeNext">&#9654;</button>
            </div>
            <div class="section-label">Midweek Meeting</div>
            <div id="homeAssignmentList" class="assignment-list"></div>
            <div class="section-divider"></div>
            <button class="collapse-toggle" id="sundayToggle">
                Sunday Assignments <span id="sundayArrow">&#9660;</span>
            </button>
            <div id="homeSundaySection" class="collapsible"></div>
        </section>

        <!-- TAB 2: ASSIGN -->
        <section id="assignTab" class="tab-page">
            <div class="week-nav">
                <button class="nav-arrow" id="assignPrev">&#9664;</button>
                <button class="week-display" id="assignWeekBtn">September 17, 2026</button>
                <button class="nav-arrow" id="assignNext">&#9654;</button>
            </div>
            <div class="assign-meeting-type">
                <label for="meetingTypeSelect">Meeting type:</label>
                <select id="meetingTypeSelect">
                    <option value="normal">Normal Week</option>
                    <option value="co_visit">CO Visit</option>
                    <option value="no_meeting">No Meeting</option>
                </select>
            </div>
            <div id="assignSlotList" class="assignment-slot-list"></div>
            <div class="assign-actions">
                <button class="btn-text" id="autoFillBtn">Auto-fill empty slots</button>
                <button class="btn-text" id="clearWeekBtn">Clear all</button>
            </div>
        </section>

        <!-- TAB 3: BROTHERS -->
        <section id="brothersTab" class="tab-page">
            <div class="brothers-top">
                <input type="text" id="brotherSearch" class="search-input" placeholder="Search brothers...">
                <button class="btn-add" id="addBrotherBtn">+ Add</button>
            </div>
            <div class="filter-row">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="elder">Elder</button>
                <button class="filter-btn" data-filter="ms">MS</button>
                <button class="filter-btn" data-filter="brother">Brother</button>
            </div>
            <div id="brotherList" class="brother-list"></div>

            <!-- ADD/EDIT PANEL (slides up) -->
            <div id="brotherPanel" class="slide-panel">
                <div class="panel-header">
                    <span id="panelTitle">Add Brother</span>
                    <button class="panel-close" id="panelCloseBtn">&#10005;</button>
                </div>
                <div class="panel-body">
                    <label>Name</label>
                    <input type="text" id="brotherNameInput" class="form-input" placeholder="Full name">

                    <label>Category</label>
                    <select id="brotherCategorySelect" class="form-input">
                        <option value="elder">Elder</option>
                        <option value="ms">MS</option>
                        <option value="brother">Brother</option>
                    </select>

                    <label>Eligible Assignments</label>
                    <div id="eligibilityChecks" class="checkbox-group">
                        <!-- Checkboxes generated by JS -->
                    </div>

                    <label>Availability</label>
                    <div class="toggle-row">
                        <span>Available for assignments</span>
                        <input type="checkbox" id="availabilityToggle" checked>
                    </div>

                    <label>Notes</label>
                    <textarea id="brotherNotes" class="form-input" rows="2" placeholder="Optional notes..."></textarea>

                    <button class="btn-save" id="saveBrotherBtn">Save</button>
                    <button class="btn-delete hidden" id="deleteBrotherBtn">Delete this brother</button>
                </div>
            </div>
            <div id="panelOverlay" class="overlay"></div>
        </section>

        <!-- TAB 4: STATS -->
        <section id="statsTab" class="tab-page">
            <div class="section-label">Sunday Assignments</div>
            <div class="week-nav" style="margin-bottom:12px">
                <button class="nav-arrow" id="sundayPrev">&#9664;</button>
                <button class="week-display" id="sundayWeekBtn">September 20, 2026</button>
                <button class="nav-arrow" id="sundayNext">&#9654;</button>
            </div>
            <input type="text" id="sundaySearch" class="search-input" placeholder="Search brother name..." style="margin-bottom:12px">
            <div id="sundayCheckList" class="sunday-checklist"></div>
            <div class="section-divider"></div>

            <div class="section-label">Fairness Overview</div>
            <div class="stats-filter-row">
                <select id="statsRangeSelect" class="form-input">
                    <option value="month">This Month</option>
                    <option value="3months">Last 3 Months</option>
                    <option value="year">This Year</option>
                    <option value="all">All Time</option>
                </select>
            </div>
            <div id="fairnessTable" class="stats-table"></div>
            <div class="section-divider"></div>

            <div class="section-label">Assignment History</div>
            <div id="historyList" class="history-list"></div>
            <div class="section-divider"></div>

            <div class="section-label">Export</div>
            <div class="export-row">
                <button class="btn-export" id="exportPdfBtn">Export Weekly Schedule (PDF)</button>
                <button class="btn-export" id="exportExcelBtn">Export History (Excel)</button>
                <button class="btn-export" id="exportJsonBtn">Backup Data (JSON)</button>
                <button class="btn-export" id="importJsonBtn">Restore Data (JSON)</button>
            </div>
            <input type="file" id="importFileInput" accept=".json" class="hidden">
        </section>

    </main>

    <!-- ===== BOTTOM TAB BAR ===== -->
    <nav class="tab-bar">
        <button class="tab-btn active" data-tab="home">Home</button>
        <button class="tab-btn" data-tab="assign">Assign</button>
        <button class="tab-btn" data-tab="brothers">Brothers</button>
        <button class="tab-btn" data-tab="stats">Stats</button>
    </nav>

    <!-- ===== SETTINGS MODAL ===== -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <span>Settings</span>
                <button class="panel-close" id="settingsCloseBtn">&#10005;</button>
            </div>
            <div class="modal-body">
                <label>Congregation Name</label>
                <input type="text" id="congNameInput" class="form-input" placeholder="e.g. UP Village">

                <label>Assignment Types</label>
                <div id="assignmentTypeList" class="settings-type-list"></div>
                <button class="btn-text" id="addTypeBtn">+ Add assignment type</button>

                <label>Theme</label>
                <div class="toggle-row">
                    <span>Dark Mode</span>
                    <input type="checkbox" id="darkModeToggle">
                </div>
            </div>
        </div>
    </div>

    <!-- ===== CONFIRMATION DIALOG ===== -->
    <div id="confirmDialog" class="modal hidden">
        <div class="modal-content modal-small">
            <p id="confirmMessage">Are you sure?</p>
            <div class="confirm-actions">
                <button class="btn-cancel" id="confirmNoBtn">Cancel</button>
                <button class="btn-danger" id="confirmYesBtn">Delete</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js');
        }
    </script>
</body>
</html>
